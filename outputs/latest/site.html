<title>Liga MX Futures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Same design as the MLS Futures page: dark top bar with centred tabs, bordered cards on a matte charcoal page, tabular odds.
   Dark only by choice (Zac, MLS page 2026-10-24). Numbers in grids, short labels, explanations in hovers only. */
:root{
  --brand:#1b1c1f;--brand-dark:#141517;--brand-fg:#cfc9bf;
  --bg:#24262a;--card:#2c2f34;--card-2:#33373d;--zebra:#2f3237;--fg:#d6d1c8;--muted:#a39d93;
  --line:#3d4148;--accent:#c48a5a;--fav:#3b3a36;--hover:#3a3e45;
  --up:#8fb58a;--down:#c9705f;--warn:#d1b06b;
  --crest-bg:#e7e2d8;--crest-fg:#24262a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 13px/1.4 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);border-bottom:2px solid var(--brand-dark)}
.top .in{max-width:1660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:stretch;justify-content:space-between;gap:0 16px;min-height:46px}
.tabs{display:flex;gap:2px;margin:0 auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--brand-fg);font:700 13.5px var(--font);padding:12px 12px 10px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--accent)}
.tab:focus-visible,button.b:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.meta{color:var(--brand-fg);font-size:12px;font-weight:600;display:flex;align-items:center;gap:10px;padding:6px 0;margin-left:auto}
main{max-width:1500px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{display:grid;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0}
.card h2{font-size:12px;font-weight:800;margin:0;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--card-2);display:flex;align-items:baseline;gap:10px;text-transform:uppercase;letter-spacing:.04em}
.card h2 small{color:var(--muted);font-size:11px;font-weight:600;text-transform:none;letter-spacing:0}
.card h2[title]::after{content:"?";display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);font-size:9px;color:var(--muted);cursor:help}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr:nth-child(even):not(.day)>td{background:var(--zebra)}
tbody tr:hover:not(.day)>td{background:var(--hover)}
th{font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--card-2);border-bottom:2px solid var(--line)}
th[title]{cursor:help}
th.l,td.l{text-align:left}
.sep{border-left:1px solid var(--line)}
td.team{font-weight:700;text-align:left;box-shadow:inset 3px 0 0 var(--cc,transparent);padding-left:10px}
td.odd{font-weight:700}td.fav{color:var(--accent)}
.tm{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.crest{width:22px;height:22px;flex:none;display:inline-grid;place-items:center;background:var(--crest-bg);border-radius:50%;padding:2px;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain}
.day td{background:var(--card-2);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:4px 10px}
.dim{opacity:.55}.mut{color:var(--muted)}
.d{font-size:10px;margin-left:3px;font-weight:600}
.pos{color:var(--up)}.neg{color:var(--down)}.warn{color:var(--warn)}
button.b{font:700 12px var(--font);padding:5px 11px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b.on{background:var(--fav);border-color:var(--accent)}
.cut td{border-bottom:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.mc{background:var(--card-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;gap:6px;min-width:0}
.mc-h{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mc-r{display:grid;grid-template-columns:minmax(0,1fr) 46px 56px;gap:6px;align-items:center;padding:3px 4px 3px 8px;border-left:3px solid var(--cc,var(--line))}
.mc-r b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-r span{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mc-s{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;display:grid;gap:2px}
.mc-s div{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.brg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;padding:10px;align-items:center}
.brc{display:grid;gap:10px;min-width:0}.brh{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.brh small{display:block;font-weight:600;letter-spacing:.02em;text-transform:none}
@media (max-width:900px){.brg{grid-template-columns:minmax(0,1fr)}}
.mc-t{display:grid;grid-template-columns:minmax(0,1fr) 44px 58px;gap:6px;align-items:center;padding:4px 4px 4px 8px;border-left:3px solid var(--cc,var(--line));border-radius:2px;cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;color:var(--fg);font:inherit;text-align:left;width:100%}
.mc-t:hover{background:var(--hover)}.mc-t.pk{background:var(--fav);box-shadow:inset 0 0 0 1px var(--accent)}
.mc-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.mc-t span{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mc-g{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 46px;gap:2px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:4px}
.mc-g span{text-align:right}.mc-g span:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc select{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:3px;font:600 10.5px var(--font);padding:1px 3px;max-width:150px}
.rng{font-size:11px;color:var(--muted);font-weight:600}.rng.wide{color:var(--warn)}
td.hm{font-weight:600;min-width:42px}td.hm.z{color:var(--muted);opacity:.45}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--muted)}
.hand{width:54px;appearance:textfield;-moz-appearance:textfield;background:var(--card-2);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:2px 4px;font:600 12.5px var(--font);text-align:right}
.hand::-webkit-inner-spin-button,.hand::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hand.edited{border-color:var(--accent);color:var(--accent)}.hand.set{font-weight:800}
.hw{display:inline-flex;align-items:stretch;gap:2px}.hstep{display:flex;flex-direction:column;gap:1px}
.hstep button{width:18px;height:11px;padding:0;border:1px solid var(--line);border-radius:2px;background:var(--card-2);color:var(--fg);font-size:7px;line-height:1;cursor:pointer}
.hstep button:hover{border-color:var(--accent);color:var(--accent)}
.status{font-size:12px;font-weight:600;color:var(--muted)}
.pill{display:inline-block;min-width:54px;padding:1px 8px;border:1px solid var(--line);border-radius:10px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.pill.act{border-color:var(--down);color:var(--down)}.pill.watch{border-color:var(--warn);color:var(--warn)}.pill.ok{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;align-items:start}
.cols>div{display:grid;gap:14px;min-width:0}
td.why{text-align:left;white-space:normal;color:var(--muted);font-size:12px;min-width:150px}
.empty{padding:10px;color:var(--muted);font-size:12px}
tr.clk{cursor:pointer}
.dr-bg{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.4)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:20;background:var(--bg);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.35);overflow-y:auto;grid-auto-rows:max-content;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 40px 14px;display:grid;gap:12px;align-content:start}
.dr-top{display:flex;align-items:center;gap:12px}.dr-top .crest{width:48px;height:48px}
.dr-name{font-size:19px;font-weight:800;line-height:1.1}.dr-sub{font-size:12px;color:var(--muted);margin-top:3px}
#drClose{margin-left:auto}
.chart{padding:6px 8px 4px}.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:600 10px var(--font)}
.lg{display:flex;gap:14px;justify-content:flex-end;padding:4px 10px 0;font-size:11px;color:var(--muted)}.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.kv td{text-align:left;white-space:normal}.kv td:first-child{font-weight:700;white-space:nowrap;width:1%}
</style>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="morning" aria-selected="true">Morning</button>
    <button class="tab" role="tab" data-tab="table" aria-selected="false">Table</button>
    <button class="tab" role="tab" data-tab="games" aria-selected="false">Games</button>
    <button class="tab" role="tab" data-tab="bracket" aria-selected="false">Liguilla</button>
    <button class="tab" role="tab" data-tab="model" aria-selected="false">Model</button>
  </div>
  <div class="meta"><button class="b" id="unit" title="American odds or percent">Odds: US</button><span id="stamp"></span></div>
</div></div>
<main>
<section class="panel" id="tab-morning">
  <div class="card"><div class="tiles" id="mTiles"></div></div>
  <div class="cols"><div>
    <div class="card"><h2 title="Every lined game. Ours: the ratings built without this round's lines. Gap: ours minus Pinnacle in goals of home margin (watch 0.15, big 0.25). Move: the line since first posted.">Games v Pinnacle <small id="mGamesSub"></small></h2><div class="scroll"><table id="mGames"></table></div></div>
    <div class="card"><h2 title="Games played since the previous report. Gap: our match-morning price minus the close, goals of home margin.">Results <small id="mResSub"></small></h2><div class="scroll"><table id="mRes"></table></div></div>
  </div><div>
    <div class="card"><h2 title="Data checks, then each hand in force judged on the closes since it was set, then ratings where Pinnacle's recent closes sit away from ours.">Today <small id="mDate"></small></h2><div class="scroll"><table id="mToday"></table></div></div>
    <div class="card"><h2 title="Rating moves of 0.03+ goals and price moves of a point or more v the previous day's run.">Moved</h2><div class="scroll"><table id="mMoved"></table></div></div>
  </div></div>
</section>
<section class="panel" id="tab-table" hidden>
  <div class="card"><h2 title="Rating: goals of expected margin v an average Liga MX side on a neutral pitch. Prices are fair (no vig) from the simulated tournaments. Small numbers: change v the previous run.">Apertura 2026 <small id="tblSub"></small></h2>
    <div class="bar"><button class="b on" id="sortR">By title price</button><button class="b" id="sortP">By table</button><button class="b on" id="dlt">Deltas on</button><span style="flex:1"></span><span class="status" id="hStat"></span><button class="b" id="hRun" title="Re-price with the edited hand adjustments: 20,000 simulations in the page, shown as the run plus the change">Run</button><button class="b" id="hReset">Reset</button><button class="b on" id="hSave" title="Save this week's hand adjustments; they are applied at the next refresh">Save</button></div>
    <div class="scroll"><table id="tbl"></table></div></div>
</section>
<section class="panel" id="tab-games" hidden>
  <div class="card"><h2 title="Pin: Pinnacle's line with the vig removed (the market-average close where no Pinnacle close is on file). Ours: the ratings' price, a played game priced from the ratings on match morning. Gap: ours minus Pinnacle, in goals of expected margin.">Games <small id="gmSub"></small></h2>
    <div class="bar"><button class="b" id="gPrev" aria-label="Earlier">‹</button><b id="gLbl"></b><button class="b" id="gNext" aria-label="Later">›</button></div>
    <div class="scroll"><table id="gm"></table></div></div>
</section>
<section class="panel" id="tab-bracket" hidden>
  <div class="card"><h2 title="Top 8 of the table, no play-in. Two legs, lower seed hosts the first. A quarter-final or semi-final level on aggregate goes to the higher seed. Semis are re-seeded 1 v 4, 2 v 3. The final goes to extra time and penalties. Each card shows its likeliest tie; the menu lists the others. Leg prices are 90 minutes, home / draw / away.">Liguilla <small id="brSub"></small></h2>
    <div class="bar"><button class="b" id="brClear">Clear picks</button><span class="status" id="brStat">click a club to send it through · the bracket re-prices on each pick</span></div>
    <div class="brg" id="brg"></div>
    <div class="scroll" id="brChg"></div></div>
  <div class="card"><h2 title="How often each club finishes in each seed across the simulated tournaments.">Seeds</h2><div class="scroll"><table id="seeds"></table></div></div>
</section>
<section class="panel" id="tab-model" hidden>
  <div class="card"><h2>Checks</h2><div class="tiles" id="tiles"></div></div>
  <div class="card"><h2>How it prices</h2><div class="scroll"><table class="kv" id="how"></table></div></div>
</section>
</main>
<div class="dr-bg" id="drBg" hidden></div><aside class="drawer" id="drawer" hidden></aside>

    return`<div class="card"><h2 title="Each price re-run under one changed assumption, 50,000 simulations on the run's dice. Range = lowest to highest of the assumption rows; the last two rows move only this club's rating.">Price ranges</h2><div class="scroll"><table><thead><tr><th class="l">If</th>${ks.map(k=>`<th>${k[1]}</th>`).join('')}<th>Title fair</th></tr></thead><tbody><tr><td class="l"><b>Run</b></td>${ks.map(k=>`<td class="odd">${f(rk[k[0]].p)}</td>`).join('')}<td class="odd">${us(rk.champion.p)}</td></tr>${D.risk.scenarios.map(sc=>`<tr><td class="l mut">${sc}</td>${ks.map(k=>`<td>${f(rk[k[0]].alt[sc])}</td>`).join('')}<td>${us(rk.champion.alt[sc])}</td></tr>`).join('')}<tr><td class="l"><b>Range</b></td>${ks.map(k=>`<td class="odd ${rk[k[0]].wide?'warn':''}">${(100*rk[k[0]].lo).toFixed(1)}–${(100*rk[k[0]].hi).toFixed(1)}</td>`).join('')}<td class="odd">${us(rk.champion.hi)} to ${us(rk.champion.lo)}</td></tr><tr><td class="l mut">rating +0.10</td>${ks.map(k=>`<td>${f(rk[k[0]].plus)}</td>`).join('')}<td>${us(rk.champion.plus)}</td></tr><tr><td class="l mut">rating −0.10</td>${ks.map(k=>`<td>${f(rk[k[0]].minus)}</td>`).join('')}<td>${us(rk.champion.minus)}</td></tr></tbody></table></div></div>`})()}
  <div class="card"><h2>Title price <small>${fut.length} run${fut.length===1?'':'s'}</small></h2><div class="chart">${line([{pts:fut,color:col}],{fmt:v=>v.toFixed(1)+'%',label:'Title price at each run'})}</div></div>
  <div class="card"><h2 title="From the club's side: positive = the club favoured. Miss: the close minus our match-morning price.">Closes</h2><div class="scroll"><table><thead><tr><th class="l">Date</th><th class="l">Opponent</th><th>Close</th><th>Ours</th><th>Miss</th><th>FT</th></tr></thead><tbody>${[...x.closes].reverse().map(q=>`<tr><td class="l mut">${q.date.slice(5)}</td><td class="l">${q.ha==='H'?'v':'@'} ${esc(q.opp)}</td><td${q.book==='avg_close'?' title="market-average close"':''}>${sg(q.close)}</td><td>${sg(q.ours)}</td><td class="odd ${Math.abs(q.miss)>=.25?'neg':Math.abs(q.miss)>=.15?'warn':''}">${sg(q.miss)}</td><td>${q.score}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('drawer').hidden=false;$('drBg').hidden=false;$('drClose').onclick=closeDr;$('drClose').focus()}
function closeDr(){$('drawer').hidden=true;$('drBg').hidden=true}
$('drBg').onclick=closeDr;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});
$('hRun').onclick=runPreview;$('hSave').onclick=saveHands;$('hReset').onclick=()=>{D.teams.forEach(t=>hand[t.team]=saved[t.team]);preview=null;table();hstat()};
/* games by round: 9 per page, newest unplayed round first */
const G=D.games,rounds=[];for(let i=0;i<G.length;i+=9)rounds.push(G.slice(i,i+9));
let gi=Math.max(0,rounds.findIndex(r=>r.some(g=>g.status!=='final')));if(gi<0)gi=rounds.length-1;
function f3(a){return a?a.map(p=>`<td>${unit==='us'?us(p):(100*p).toFixed(0)+'%'}</td>`).join(''):'<td class="dim">–</td><td class="dim">–</td><td class="dim">–</td>'}
function games(){
  const r=rounds[gi]||[];let h=`<thead><tr><th rowspan="2" class="l">Kickoff ET</th><th rowspan="2" class="l">Home</th><th rowspan="2" class="l">Away</th><th colspan="3" class="sep">Pin fair</th><th colspan="3" class="sep">Ours</th><th rowspan="2" class="sep" title="Ours minus Pinnacle, goals of expected home margin">Gap</th><th rowspan="2">FT</th></tr><tr><th class="sep">H</th><th>D</th><th>A</th><th class="sep">H</th><th>D</th><th>A</th></tr></thead><tbody>`;
  let day='';r.forEach(g=>{const d=new Date(g.ko),ds=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'});
    if(ds!==day){day=ds;h+=`<tr class="day"><td colspan="11">${ds}</td></tr>`}
    const gap=g.g_pin!=null&&g.g_model!=null?g.g_model-g.g_pin:null,gc=gap==null?'':Math.abs(gap)>=.25?'neg':Math.abs(gap)>=.15?'warn':'';
    h+=`<tr><td class="l">${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})}</td><td class="team" style="--cc:${(T[g.home]||{}).hex}">${club(g.home)}</td><td class="team" style="--cc:${(T[g.away]||{}).hex}">${club(g.away)}</td>${f3(g.pin).replace('<td','<td class="sep"'+(g.book==='avg_close'?' title="market-average close"':''))}${f3(g.model).replace('<td','<td class="sep"')}<td class="sep odd ${gc}" title="${g.g_pin!=null?'Pin '+sg(g.g_pin)+' · ours '+sg(g.g_model):''}">${gap==null?'<span class="dim">–</span>':sg(gap)}</td><td class="odd">${g.status==='final'?g.hg+'–'+g.ag:'<span class="dim">–</span>'}</td></tr>`});
  $('gm').innerHTML=h+'</tbody>';$('gLbl').textContent=`Round ${gi+1}`;$('gPrev').disabled=gi<=0;$('gNext').disabled=gi>=rounds.length-1;
  $('gmSub').textContent=r.some(g=>g.status!=='final')?'unplayed lined games are priced off Pinnacle in the sim':'ratings on match morning v the close';
}
/* Liguilla: matchup cards; a pick forces a club through its round and the page engine re-prices everything behind it */
const TI={};E.teams.forEach((t,i)=>TI[t]=i);const picks={qf:[],sf:[],f:[]},cardSel={};let wi=null;
function hda3(g,T){const kn=E.kn,mh=Math.max(T/2+g/2,kn.goal_floor),ma=Math.max(T/2-g/2,kn.goal_floor),c=Math.max(0,Math.min(kn.shared_goals_mean,Math.min(mh,ma)-kn.goal_floor)),n=11;
  const pm=l=>{const a=[Math.exp(-l)];for(let k=1;k<n;k++)a.push(a[k-1]*l/k);return a},ph=pm(mh-c),pa=pm(ma-c),pc=pm(c),rho=kn.dc_rho||0;let H=0,Dr=0,A=0;
  for(let x=0;x<n;x++)for(let y=0;y<n;y++){let p=0;for(let k=0;k<=Math.min(x,y);k++)p+=pc[k]*ph[x-k]*pa[y-k];
    if(rho){if(x===0&&y===0)p*=1-mh*ma*rho;else if(x===1&&y===0)p*=1+ma*rho;else if(x===0&&y===1)p*=1+mh*rho;else if(x===1&&y===1)p*=1-rho}
    if(x>y)H+=p;else if(x===y)Dr+=p;else A+=p}const z=H+Dr+A;return[H/z,Dr/z,A/z]}
function legRow(h,a,lab){const i=TI[h],j=TI[a],pl=E.lig_played.find(x=>x[0]===i&&x[1]===j),ln=E.lig_lines.find(x=>x[0]===i&&x[1]===j);
  if(pl)return`<span>${lab} @ ${esc(T[h].code)}</span><span></span><span>FT</span><span>${pl[2]}–${pl[3]}</span>`;
  const g=ln?ln[2]:E.market[i]+hv(h)-E.market[j]-hv(a)+E.he+E.club[i],p=hda3(g,ln?ln[3]:E.kn.avg_total_goals);
  return`<span title="${ln?'Pinnacle line':'our ratings'} · home margin ${sg(g)}">${lab} @ ${esc(T[h].code)}${ln?' · Pin':''}</span>`+p.map(x=>`<span>${unit==='us'?us(x):(100*x).toFixed(0)+'%'}</span>`).join('')}
function card(key,title,rnd){const src=(wi?wi.__cards:D.bracket.cards)[key]||[];if(!src.length)return'';const si=Math.min(cardSel[key]||0,src.length-1),p=src[si],pk=picks[rnd];
  const row=(t,pr_)=>`<button class="mc-t${pk.indexOf(TI[t])>=0?' pk':''}" data-r="${rnd}" data-t="${esc(t)}" style="--cc:${T[t].hex}" title="send ${esc(t)} through"><b>${club(t)}</b><span>${(100*pr_).toFixed(0)}%</span><span>${us(pr_)}</span></button>`;
  const opts=src.length>1?`<select data-k="${key}" aria-label="Other ties for ${title}">${src.map((x,i)=>`<option value="${i}"${i===si?' selected':''}>${(100*x.share).toFixed(0)}% ${esc(T[x.hi].code)} v ${esc(T[x.lo].code)}</option>`).join('')}</select>`:`<span>${p.share>.999?'set':(100*p.share).toFixed(0)+'%'}</span>`;
  return`<div class="mc"><div class="mc-h"><span>${title}</span>${opts}</div>${row(p.hi,p.p_hi)}${row(p.lo,1-p.p_hi)}<div class="mc-g"><span></span><span>H</span><span>D</span><span>A</span>${legRow(p.lo,p.hi,'Leg 1')}${legRow(p.hi,p.lo,'Leg 2')}</div></div>`}
function bracket(){
  const B=D.bracket,dt=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}),dr=a=>dt(a[0])+' – '+dt(a[1]);
  $('brSub').textContent=(B.locked?'seeds set':'projected · seeds settle Nov 22')+(wi?' · what-if, 20,000 simulations':' · '+D.header.n.toLocaleString()+' simulations');
  $('brg').innerHTML=`<div class="brc"><div class="brh">Quarter-finals<small>${dr(B.dates.qf)}</small></div>${[0,1,2,3].map(k=>card('q'+k,B.slots[k].hi_seed+' v '+B.slots[k].lo_seed,'qf')).join('')}</div><div class="brc"><div class="brh">Semi-finals<small>${dr(B.dates.sf)}</small></div>${card('sa','Semi 1 v 4','sf')}${card('sb','Semi 2 v 3','sf')}</div><div class="brc"><div class="brh">Final<small>${dr(B.dates.final)}</small></div>${card('f','Final','f')}</div>`;
  $('brg').querySelectorAll('.mc-t').forEach(b=>b.onclick=()=>{const a=picks[b.dataset.r],i=TI[b.dataset.t],j=a.indexOf(i);if(j>=0)a.splice(j,1);else a.push(i);rerun()});
  $('brg').querySelectorAll('select').forEach(x=>x.onchange=()=>{cardSel[x.dataset.k]=+x.value;bracket()});
  const np=picks.qf.length+picks.sf.length+picks.f.length;$('brClear').disabled=!np;
  if(wi){const rows=D.teams.map(t=>({t,was:t.m.champion,now:Math.max(0,Math.min(1,t.m.champion+wi[t.team].champion-wi.__base[t.team].champion)),fw:t.m.reach_final,fn:Math.max(0,Math.min(1,t.m.reach_final+wi[t.team].reach_final-wi.__base[t.team].reach_final))})).filter(r=>Math.abs(r.now-r.was)>=.003||Math.abs(r.fn-r.fw)>=.003).sort((a,b)=>Math.abs(b.now-b.was)-Math.abs(a.now-a.was));
    $('brChg').innerHTML=`<table><thead><tr><th class="l">Changes v the run</th><th>Final was</th><th>Final now</th><th class="sep">Title was</th><th>Title now</th><th>Move</th><th>Fair</th></tr></thead><tbody>`+rows.map(r=>`<tr><td class="team" style="--cc:${r.t.hex}">${club(r.t.team)}</td><td>${(100*r.fw).toFixed(1)}%</td><td class="odd">${(100*r.fn).toFixed(1)}%</td><td class="sep">${(100*r.was).toFixed(1)}%</td><td class="odd">${(100*r.now).toFixed(1)}%</td><td class="odd ${r.now>r.was?'pos':'neg'}">${r.now>r.was?'+':''}${(100*(r.now-r.was)).toFixed(1)}</td><td class="odd">${us(r.now)}</td></tr>`).join('')+'</tbody></table>'}
  else $('brChg').innerHTML='';
  const rows=D.teams.filter(t=>t.m.liguilla>=.005).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  $('seeds').innerHTML=`<thead><tr><th class="l">Club</th><th>Pts</th>${[1,2,3,4,5,6,7,8].map(k=>`<th>${k}</th>`).join('')}<th class="sep">Out</th></tr></thead><tbody>`+rows.map(t=>`<tr><td class="team" style="--cc:${t.hex}">${club(t.team)}</td><td class="odd">${t.pts}</td>${t.seeds.map(p=>`<td class="hm${p<.005?' z':''}" style="${p>=.005?`background:rgba(196,138,90,${(.08+.5*p).toFixed(2)})`:''}">${p<.005?'–':(100*p).toFixed(0)+'%'}</td>`).join('')}<td class="sep hm${1-t.m.liguilla<.005?' z':''}">${1-t.m.liguilla<.005?'–':(100*(1-t.m.liguilla)).toFixed(0)+'%'}</td></tr>`).join('')+'</tbody>';
}
function rerun(){const np=picks.qf.length+picks.sf.length+picks.f.length;for(const k in cardSel)delete cardSel[k];if(!np){wi=null;bracket();return}
  $('brStat').textContent='running…';setTimeout(()=>{const h=E.teams.map(t=>hv(t)),base=simulate(h,20000);wi=simulate(h,20000,picks);wi.__base=base;
    $('brStat').textContent=np+' pick'+(np>1?'s':'')+': '+['qf','sf','f'].flatMap(r=>picks[r].map(i=>E.teams[i]+' through the '+(r==='qf'?'quarter-final':r==='sf'?'semi-final':'final'))).join(', ');bracket()},30)}
function model(){
  const c=D.checks,h=D.header,k=D.knobs;
  const tile=(a,b,s)=>`<div class="tile"><div class="k">${a}</div><div class="v">${b}</div><div class="s">${s}</div></div>`;
  $('tiles').innerHTML=tile('Miss v the close',c.all.rmse.toFixed(3),`goals, a week out · ${c.all.n.toLocaleString()} closes 2013–26`)+tile('This tournament',c.season.rmse.toFixed(3),`goals, a week out · ${c.season.n} closes`)+tile('Spread',c.all.slope.toFixed(2),'slope of the close on our price · 1.00 is right')+tile('Liguilla ties','62% v 64%','priced v happened, higher seed · 182 ties 2012–26')+(D.opta&&D.opta.date?tile('Opta agreement',D.opta.corr.toFixed(2),'rank correlation with Opta Power Rankings · '+D.opta.date):'')+tile('Home edge',sg(h.home_edge),'goals, last 306 closes')+tile('Pinnacle closes',h.pinnacle_closes,'own captures on file · the rest market-average');
  const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
  $('how').innerHTML='<tbody>'+row('Ratings',Math.round(100*(1-(k.shots_weight||0)))+'% market, '+Math.round(100*(k.shots_weight||0))+'% a shots-on-target proxy for xG (ESPN stats, 45-day half-life). Market: a Kalman filter over every closing line since 2012 (Pinnacle to Oct 2025, the market-average close since), plus the posted Pinnacle lines for the coming round. One strength per club, moving '+k.kalman_q_day+' goals a day; a break between tournaments pulls every club '+Math.round(100*(1-k.kalman_off_shrink))+'% toward the mean.')+row('Home','League home edge from the last 306 closes, plus each club’s own home delta (Tijuana +0.19, Monterrey +0.07, Toluca +0.06; Atlas −0.07).')+row('Match','Expected margin and total into two Poisson scores with a shared part ('+k.shared_goals_mean+') and a draw correction ('+k.dc_rho+'). Total '+k.avg_total_goals+' unless Pinnacle has posted one.')+row('Tournament',h.n.toLocaleString()+' simulations on a fixed seed. Each draws every club’s strength once (sd '+k.rating_sd+'), plays the remaining league games (a game with a fresh Pinnacle line at that line), ranks the table on points, goal difference, goals for.')+row('Liguilla','Top 8, no play-in. Two legs, lower seed at home first. A quarter-final or semi-final level on aggregate goes to the higher seed; semis re-seeded; the final plays extra time, then penalties as a coin.')+row('Not in yet','Absences, rest and motivation factors, team totals.')+'</tbody>';
}
function all(){morning();table();games();bracket();model();$('unit').textContent='Odds: '+(unit==='us'?'US':'%')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='tab-'+b.dataset.tab)});
